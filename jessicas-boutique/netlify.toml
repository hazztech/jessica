[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: let React handle every route
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Keep admin pages out of search engines
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Optional extra lock on the /admin page itself (Netlify "Basic-Auth" header;
# check your Netlify plan supports it). This is IN ADDITION to the server-side
# role checks in every admin function — never instead of them.
# [[headers]]
#   for = "/admin*"
#   [headers.values]
#     Basic-Auth = "jessica:CHANGE_ME"
